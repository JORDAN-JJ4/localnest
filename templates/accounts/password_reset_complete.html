{% extends 'base.html' %}

{% block title %}Password Reset Complete | LocalNest{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom glass-card p-5 text-center fade-in-up">
                <div class="card-body">
                    <div class="mb-4">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
                    </div>
                    <h1 class="h3 fw-bold text-success mb-3">Password Reset Complete</h1>
                    <p class="text-muted mb-4">Your password has been successfully reset. You can now log in using your new password.</p>
                    
                    <a href="{% url 'accounts:login' %}" class="btn btn-orange w-100 py-2.5">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
