{% extends 'base.html' %}

{% block title %}Reset Password | LocalNest{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom glass-card p-4 fade-in-up">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="bi bi-key-fill text-success fs-1"></i>
                        <h1 class="h3 mt-2 fw-bold text-success">Reset Password</h1>
                        <p class="text-muted">Enter your email and we'll send you a password reset link</p>
                    </div>

                    <form method="post" novalidate>
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label for="id_email" class="form-label fw-semibold text-muted">Email Address</label>
                            <input type="email" name="email" id="id_email" class="form-control" required>
                            {% if form.email.errors %}
                                <div class="text-danger small mt-1">{{ form.email.errors.0 }}</div>
                            {% endif %}
                        </div>

                        <button type="submit" class="btn btn-orange w-100 py-2.5">Send Password Reset Link</button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <a href="{% url 'accounts:login' %}" class="text-success text-decoration-none small fw-semibold">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
