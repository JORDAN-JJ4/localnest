{% extends 'base.html' %}

{% block title %}Password Changed | LocalNest{% endblock %}

{% block content %}
<div class="container my-5 text-center fade-in-up">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom glass-card p-5">
                <div class="card-body">
                    <div class="mb-4">
                        <i class="bi bi-shield-check text-success" style="font-size: 4rem;"></i>
                    </div>
                    <h3 class="fw-bold text-success-emphasis mb-3" style="font-family: var(--heading-font);">Password Changed Successfully</h3>
                    <p class="text-muted mb-4">Your security credentials have been updated. You can now continue exploring LocalNest with your new password.</p>
                    <a href="{% url 'dashboard:dispatcher' %}" class="btn btn-orange px-4 py-2 fw-bold" style="border-radius: 12px;">Go to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
